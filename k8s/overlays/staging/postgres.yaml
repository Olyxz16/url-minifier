apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: url-minifier
spec:
  interval: 5m
  chart:
    spec:
      chart: postgresql
      version: "18.5.14"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    primary:
      resources:
        limits:
          memory: "4Gi"
          cpu: "500m"
        requests:
          memory: "128Mi"
          cpu: "250m"
