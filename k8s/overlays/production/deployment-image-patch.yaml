apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: url-minifier
spec:
  template:
    spec:
      initContainers:
        - name: db-migration
          image: ghcr.io/olyxz16/url-minifier/migration:v1.0.0 # {"$imagepolicy": "flux-system:url-minifier-migration-image-policy"}
      containers:
        - name: api
          image: ghcr.io/olyxz16/url-minifier/api:v1.0.0 # {"$imagepolicy": "flux-system:url-minifier-api-image-policy"}
