apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: url-minifier-api-migration-sync
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: url-minifier
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/base/api
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: url-minifier-sops-age
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: db-migration
      namespace: url-minifier
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: url-minifier-api-sync
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: url-minifier
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: api-migration
  path: ./k8s/base/api-deploy
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: url-minifier-sops-age
