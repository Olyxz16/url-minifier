apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: url-minifier
  labels:
    app: url-minifier-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: url-minifier-api
  template:
    metadata:
      labels:
        app: url-minifier-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: url-minifier-api
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: db-migration
          image: ghcr.io/olyxz16/url-minifier/migration:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: database-url
      containers:
        - name: api
          image: ghcr.io/olyxz16/url-minifier/api:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: GOMEMLIMIT
              value: "230Mi"
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: user-pass
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: redis-password
            - name: TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: token-secret
            - name: GOOGLE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: google-access-key-id
            - name: GOOGLE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: google-secret-access-key
          envFrom:
            - configMapRef:
                name: api-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
