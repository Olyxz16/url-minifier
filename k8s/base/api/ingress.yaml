apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: url-minifier
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-dns-prod"
    traefik.ingress.kubernetes.io/router.middlewares: url-minifier-api-headers@kubernetescrd,url-minifier-api-compress@kubernetescrd,url-minifier-api-ratelimit@kubernetescrd,url-minifier-api-circuitbreaker@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: url-minifier.olyxz16.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-svc
                port:
                  number: 80

  tls:
    - hosts:
        - url-minifier.olyxz16.fr
      secretName: api-tls-cert
